<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>MediSphere | Reset Password</title>
    <meta name="description" content="Reset your MediSphere account password." />
    {% include 'tailwind_setup.html' %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Inter", sans-serif; background-color: #f8fafc; -webkit-font-smoothing: antialiased; }
      .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; vertical-align: middle; display: inline-block; line-height: 1; }
      .input-focus:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center relative bg-slate-50 overflow-x-hidden">

    <!-- Back to login -->
    <a href="{% url 'login' %}"
       class="fixed top-0 right-10 z-50 flex items-center gap-1.5 px-3.5 py-2 hover:text-primary hover:border-primary/40 transition-colors text-sm font-medium">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span>
      Back to Login
    </a>

    <main class="w-full max-w-md px-4 py-8">
      <!-- Logo & Branding -->
      <div class="text-center mb-6">
        <a href="/" class="inline-flex items-center gap-2 mb-2">
          <span class="text-2xl font-extrabold text-primary">MediSphere</span>
        </a>
      </div>

      <!-- Reset Card -->
      <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
        <div class="mb-6">
          <h1 class="text-xl font-bold text-slate-900 mb-1">Reset Password</h1>
          <p class="text-xs text-slate-500">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <!-- Django Messages / Form Errors -->
        {% if form.errors %}
          <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 text-red-700 border border-red-200 text-xs font-medium">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px]">error</span>
              Please correct the errors below.
            </div>
          </div>
        {% endif %}

        <!-- Form -->
        <form class="space-y-4" method="POST">
          {% csrf_token %}

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700" for="id_email">Email Address</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">mail</span>
              <input
                class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none input-focus"
                id="id_email"
                name="email"
                placeholder="john@example.com"
                type="email"
                required
              />
            </div>
          </div>

          <!-- CTA Button -->
          <button
            class="w-full bg-primary text-white py-3 rounded-lg text-sm font-bold shadow hover:bg-blue-700 transition-colors flex items-center justify-center mt-4"
            type="submit"
          >
            Send Reset Link
          </button>
        </form>

      <!-- Footer Info -->
      <div class="mt-8 text-center space-y-1 text-slate-400">
        <p class="text-[11px]">&copy; 2026 MediSphere. All rights reserved.</p>
      </div>
    </main>
  </body>
</html>
